<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evin's Wish Archive</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      text-align: center;
      padding: 30px 15px;
      color: #292929;
    }

    .container {
      max-width: 420px;
      margin: auto;
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
    }

    h1 { font-size: 27px; }
    p { color: #666; }

    button {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: #292929;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    input {
      width: 90%;
      padding: 13px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .hidden { display: none; }

    .wish {
      background: #f5f3ef;
      padding: 15px;
      margin: 12px 0;
      border-radius: 10px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>EVIN'S WISH ARCHIVE</h1>
  <p>A collection of voices, love and memories.</p>

  <div id="home">
    <button onclick="showRecord()">🎙️ Record a Wish</button>
    <button onclick="showWishes()">🎧 Hear the Wishes</button>
  </div>

  <div id="record" class="hidden">
    <h2>Leave a Wish</h2>

    <input id="name" placeholder="Your Name">

    <button id="start" onclick="startRecording()">Start Recording</button>
    <button id="stop" onclick="stopRecording()" disabled>Stop Recording</button>

    <audio id="preview" controls class="hidden"></audio>

    <button id="submit" onclick="submitWish()" disabled>Submit Wish</button>

    <p id="recordStatus"></p>
    <button onclick="goHome()">← Back</button>
  </div>

  <div id="wishes" class="hidden">
    <h2>Recorded Wishes</h2>
    <div id="wishList">Loading...</div>
    <button onclick="goHome()">← Back</button>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwAkIu9R5oa5xR5M707gUcWeEnAr1kGqnBLTDxHDnmdDLK421H8NSfBNExU7rB-51Bs3Q/exec";

let recorder;
let audioChunks = [];
let audioBlob;

function hideAll() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("record").classList.add("hidden");
  document.getElementById("wishes").classList.add("hidden");
}

function goHome() {
  hideAll();
  document.getElementById("home").classList.remove("hidden");
}

function showRecord() {
  hideAll();
  document.getElementById("record").classList.remove("hidden");
}

function showWishes() {
  hideAll();
  document.getElementById("wishes").classList.remove("hidden");

  document.getElementById("wishList").innerText = "Loading...";

  const callbackName = "wishCallback";
  const script = document.createElement("script");

  window[callbackName] = function(wishes) {
    displayWishes(wishes);
    delete window[callbackName];
    script.remove();
  };

  script.src = API_URL + "?callback=" + callbackName;

  script.onerror = function() {
    document.getElementById("wishList").innerText =
      "Unable to load wishes. Please try again.";
    delete window[callbackName];
    script.remove();
  };

  document.body.appendChild(script);
}

async function startRecording() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("Microphone access is not supported in this browser.");
    }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    if (!window.MediaRecorder) {
      throw new Error("Audio recording is not supported in this browser.");
    }

    const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ? "audio/webm;codecs=opus"
      : "audio/webm";

    recorder = new MediaRecorder(stream, { mimeType });
    audioChunks = [];

    recorder.ondataavailable = event => {
      if (event.data.size > 0) {
        audioChunks.push(event.data);
      }
    };

    recorder.onstop = () => {
      audioBlob = new Blob(audioChunks, { type: recorder.mimeType });

      const preview = document.getElementById("preview");
      preview.src = URL.createObjectURL(audioBlob);
      preview.classList.remove("hidden");

      document.getElementById("submit").disabled = false;

      stream.getTracks().forEach(track => track.stop());
    };

    recorder.start();

    document.getElementById("start").disabled = true;
    document.getElementById("stop").disabled = false;
    document.getElementById("recordStatus").innerText =
      "Recording in progress...";

  } catch (error) {
    alert(error.message);
  }
}

function stopRecording() {
  if (recorder && recorder.state === "recording") {
    recorder.stop();
  }

  document.getElementById("start").disabled = false;
  document.getElementById("stop").disabled = true;
  document.getElementById("recordStatus").innerText =
    "Recording completed. Preview your wish.";
}

async function submitWish() {
  const name = document.getElementById("name").value.trim();

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  if (!audioBlob) {
    alert("Please record a wish first.");
    return;
  }

  const submitButton = document.getElementById("submit");
  submitButton.disabled = true;

  document.getElementById("recordStatus").innerText =
    "Submitting your wish...";

  try {
    const base64Audio = await new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onloadend = () => {
        if (reader.error) {
          reject(reader.error);
        } else {
          resolve(reader.result.split(",")[1]);
        }
      };

      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(audioBlob);
    });

    const data = {
      name: name,
      audio: base64Audio,
      mimeType: audioBlob.type
    };

    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    document.getElementById("recordStatus").innerText =
      "Your wish has been sent. Please allow a moment for it to appear in the archive.";

  } catch (error) {
    alert("Unable to submit your wish. Please try again.");
    submitButton.disabled = false;
    document.getElementById("recordStatus").innerText =
      "Submission failed.";
  }
}

function displayWishes(wishes) {
  const list = document.getElementById("wishList");
  list.innerHTML = "";

  if (!wishes || wishes.length === 0) {
    list.innerText = "No wishes recorded yet.";
    return;
  }

  wishes.forEach(wish => {
    const item = document.createElement("div");
    item.className = "wish";

    const name = document.createElement("h3");
    name.textContent = wish.name || "Anonymous";

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = wish.url;

    item.appendChild(name);
    item.appendChild(audio);
    list.appendChild(item);
  });
}

</script>

</body>
</html>
